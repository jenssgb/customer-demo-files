context:
  customer:
    title: "Why Zava works"
    intro: >-
      Zava is neutral enough for any customer audience and concrete enough for a serious
      business demo: retail, supply chain, finance, sales, and executive decisioning in one storyline.
    notes:
      - "Microsoft Ignite uses Zava as a fictional athletic-wear demo company. This version turns that concept into a universal Microsoft 365 Copilot demo: one urgent order, scattered context, operational risk, margin pressure, and an executive commitment."
      - "Feature grounding: Copilot Chat provides secure AI chat with Enterprise Data Protection, file upload, Copilot Pages, and agents. Microsoft 365 Copilot adds work grounding through Microsoft Graph, Office app integration, and broader agent access."
    sources:
      - { label: "Microsoft Ignite BRK284", url: "https://ignite.microsoft.com/en-US/sessions/BRK284" }
      - { label: "Copilot Chat overview", url: "https://learn.microsoft.com/copilot/overview" }
      - { label: "Microsoft 365 Copilot overview", url: "https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-overview" }

  setup:
    title: "Ten minutes before the demo"
    roles:
      - { name: "User roles", body: "Preston Morales is the primary ZAVA demo user for the full Microsoft 365 Copilot flow. MOD Administrator stays separate for admin settings, Copilot Studio, Agent 365, connector, and MCP governance. Selma shows Copilot Chat without a full Copilot license. Leila starts Teams meetings with Facilitator or Interpreter only when the simulator path needs it." }
      - { name: "Agent trilogy roles (demos 7-11)", body: "Keep makers fully licensed: one Agent Builder maker and one Copilot Studio maker. The consumer who runs the agents should also be fully licensed (the Copilot Chat user is only an optional bonus with Pay-as-you-go). Governance roles are split deliberately: only an AI Administrator or Global Administrator can APPROVE a request; Global Reader / AI Reader / Security Reader / Reports Reader can SEE the estate but not act; a Power Platform Administrator (or Environment Admin) owns the Copilot Studio environments and DLP. Use least privilege — do not run the whole demo as Global Admin. Build one or two swarm agents under a disposable maker you will hard-delete to show the ownerless incident in demo 11." }
      - { name: "Tabs", body: "In Preston's session, open m365copilot.com, Excel, Outlook, Word, PowerPoint, and Agent Builder. In the admin session, keep Microsoft 365 admin center, Copilot Studio, and Power Platform ready." }
      - { name: "Files", body: "Place all files from the ZAVA-Demo folder in Preston's OneDrive or upload them step by step." }
      - { name: "Model choice", body: "Use Think Deeper or an advanced reasoning mode for complex analysis prompts if available." }
      - { name: "Copilot Chat baseline", body: "Use Selma only when you want to show the Copilot Chat baseline without full Microsoft 365 Copilot work grounding." }
      - { name: "Backup", body: "If Office integration is slow, run the same prompt in Copilot Chat with file upload." }

  timing:
    title: "45-minute live run"
    rows:
      - { when: "00:00", what: "Frame the stakes", note: "20,000 shirts, 14 days, customer response by 17:00." }
      - { when: "03:00", what: "Copilot Chat", note: "Condense context, find action items, and shape the decision." }
      - { when: "10:00", what: "Analyst agent and Copilot in Excel", note: "Feasibility, risk, price floor, and management summary." }
      - { when: "20:00", what: "Copilot in Outlook and Word", note: "Customer response and operations plan." }
      - { when: "28:00", what: "Copilot in PowerPoint", note: "Executive story for the launch review." }
      - { when: "32:00", what: "Build agents", note: "Flagship Policy Navigator + the swarm in Agent Builder, then the Employee Service Desk and autonomous Onboarding Concierge in Copilot Studio." }
      - { when: "40:00", what: "Govern with Agent 365", note: "See the whole estate, approve the acting agent with scope, then three incidents — injection, ownerless, over-permissioned — across the swarm." }

  qa:
    title: "Discussion answers"
    items:
      - { q: "Copilot Chat vs. Microsoft 365 Copilot?", a: "Copilot Chat is the secure entry point with web grounding, file upload, Pages, and agents. Microsoft 365 Copilot adds work grounding through Microsoft Graph and deep Office integration." }
      - { q: "Why so many files?", a: "Premium demos need real grounding: email, meeting notes, data, memo, risk register, Office artifacts, finance exports, and legal documents make the workflow realistic." }
      - { q: "What is the main proof point?", a: "The demo is not about prompting. It is a product-led decision flow across Chat, Analyst, Excel, Outlook, Word, PowerPoint, Agent Builder, Agent 365, Notebooks, Finance controls, and Legal Agent in Word." }
      - { q: "What is the agent value?", a: "The agent repeats the process for new orders and packages sources, rules, and escalation logic." }

  feature_matrix:
    title: "Feature matrix for this demo"
    intro: "Verified with Microsoft Learn. Scenario labels use visible product, feature, or agent names."
    cards:
      - { track: chat, h: "Copilot Chat and file upload", p: "Can do: secure AI chat with web grounding, file upload, Copilot Pages, image generation, and agents. Limits: without a Microsoft 365 Copilot add-on license, Copilot Chat is not automatically grounded in Microsoft Graph data. Demo implication: upload or reference the Zava files explicitly." }
      - { track: chat, h: "Enterprise Data Protection", p: "Can do: prompts and responses for Entra-signed-in users are covered by DPA and Product Terms. Limits: web queries and Anthropic-based capabilities have additional data-handling notes. Demo implication: position security clearly and avoid blanket compliance claims." }
      - { track: analysis, h: "Excel Edit with Copilot", p: "Can do: edit workbooks through chat, including tables, charts, PivotTables, and formulas. Limits: formerly Agent Mode; availability depends on license, client, rollout, and tenant configuration. Demo implication: keep the prepared workbook ready; use Chat with XLSX upload as backup." }
      - { track: apps, h: "Word, Excel, and PowerPoint Agents", p: "Can do: create Office files directly from Copilot Chat and work with organizational data for licensed users. Requirements: Anthropic models must be enabled. Limits: region, tenant, government and sovereign cloud restrictions apply. Demo implication: treat as an optional wow moment; seed files are the backup." }
      - { track: agents, h: "Agent Builder", p: "Can do: build declarative agents with natural language, add up to 20 knowledge sources, turn on Code interpreter or Image generator, test on Try it, and share. Limits: declarative only - no actions or API calls; Name 30 / Description 1000 / Instructions 8000 character caps; not on mobile. Demo implication: build the flagship Policy Navigator live and pre-build the ~20-agent swarm, and do not promise external actions." }
      - { track: agents, h: "Agent Builder knowledge & connectors", p: "Can do: add public websites, SharePoint/OneDrive content, uploaded files, Teams chat URLs, and admin-enabled connectors as knowledge. Limits: public URLs are capped; connectors require admin setup and are knowledge, not action tools. Demo implication: show public URL knowledge live and position the connector as the admin-enabled enterprise path." }
      - { track: agents, h: "Copilot Studio autonomous agents & Entra Agent ID", p: "Can do: build low-code agents that act - interactive (a person starts them) or autonomous (event, schedule, or connector trigger plus an agent flow). Every Copilot Studio agent gets a Microsoft Entra Agent ID at creation; an admin enables the Entra-backed identity per environment (Power Platform admin center > Copilot > Settings). Connector actions use on-behalf-of and are governable with Conditional Access. Limits: Entra Agent ID for Copilot Studio is preview; trial environments cannot publish. Demo implication: build the autonomous Onboarding Concierge agent and validate its Entra Agent ID GUID under Settings > Advanced > Metadata." }
      - { track: agents, h: "Copilot Studio MCP & Agent 365 tools", p: "Can do: add MCP servers as tools in Copilot Studio and govern BYO MCP through the Agent 365 Tools registry, requests, approve/reject, block/unblock, and observability. Limits: BYO MCP is preview; Agent Builder is not yet supported. Demo implication: MCP is the production tool path after Agent Builder." }
      - { track: agents, h: "Researcher and Analyst", p: "Can do: first-party experiences for research and analysis in Copilot Chat Tools. Limits: availability varies by tenant and cloud; not in GCC, GCCH, or DoD. Demo implication: use as optional premium moments; keep uploaded-file Chat prompts as backup." }
      - { track: collab, h: "Teams Facilitator", p: "Can do: collaborative real-time notes, AI Q&A, timeline markers, Teams Rooms support. Limits: requires Copilot + Teams licensing; some Planner/Word/Loop capabilities preview; not for 1:1, group, or external meetings. Demo implication: show live only when meeting policy is ready." }
      - { track: collab, h: "Teams Interpreter", p: "Can do: real-time speech-to-speech translation in supported Teams meetings. Limits: requires Copilot + Teams + eligible base license; 20 hours/user/month; not for town halls, webinars, Teams free, Rooms-scheduled, or unscheduled 1:1 calls. Demo implication: optional global collaboration moment." }
      - { track: governance, h: "Microsoft Agent 365", p: "Can do: observe, govern, and secure agents through a centralized control plane. Agent Builder, Copilot Studio, and Foundry agents integrate; Copilot Studio agents appear in the registry and emit telemetry automatically. Limits: some activity views are preview and tenant/user scoped. Demo implication: show registry, activity, ownership, risk, and governance actions after the build." }
    sources:
      - { label: "Agent Builder", url: "https://learn.microsoft.com/microsoft-365/copilot/extensibility/agent-builder" }
      - { label: "Copilot Studio MCP", url: "https://learn.microsoft.com/microsoft-copilot-studio/mcp-add-existing-server-to-agent" }
      - { label: "Agent 365 tools", url: "https://learn.microsoft.com/microsoft-365/admin/manage/manage-tools-for-agent?view=o365-worldwide" }

  # The question every customer asks: "we already see these agents in the admin
  # center — so what does Agent 365 actually add?" This tile is the griffbereit answer.
  agent_governance:
    title: "Agent governance: baseline admin center vs Microsoft Agent 365"
    intro: >-
      Read the 'Applies to' column first — it says WHICH agent type each row is about. Types in this demo:
      Agent Builder agents (demo 7) are declarative and knowledge-only — they run on the Microsoft 365 Copilot platform
      and have NO identity of their own. Copilot Studio agents (demo 10) are low-code, can act, and each gets a Microsoft
      Entra Agent ID. Foundry is the pro-code third type. First-party agents (Researcher & Analyst) are Microsoft-installed
      Copilot experiences — governed differently. Everything you build already shows up in the Microsoft 365 admin
      center with just an admin role; a Microsoft Agent 365 / E7 license adds the security and risk depth on top.
      For Copilot Studio agents there is a THIRD plane — the Power Platform admin center — that owns build-time governance
      (environments, ALM, DLP, capacity); Agent 365 does not replace it, the two are complementary. Verified against Microsoft Learn.
    columns:
      - "Capability"
      - "Applies to (agent type)"
      - "Baseline — Copilot Control System (admin role only, no extra license)"
      - "Adds with Microsoft Agent 365 / Microsoft E7"
    rows:
      - - "Appears in the agent registry / inventory automatically on creation"
        - "Agent Builder + Copilot Studio (+ Foundry, SharePoint, 3rd-party)"
        - "✓ Microsoft 365 admin center > Agents > All agents. Needs only an admin role — AI Reader is least-privilege — not a license."
        - "✓ Same registry, now the converged Agent 365 control plane, plus the Agent Map."
      - - "Draft / unpublished agents are visible to admins"
        - "Copilot Studio only — Agent Builder, Foundry & SharePoint drafts are not yet supported"
        - "✓ But only Copilot Studio drafts surface today."
        - "✓ Same limitation — surfaced in the registry."
      - - "Power Platform inventory — tenant-wide view of every Power-Platform-built agent INCLUDING drafts (Copilot Studio + Agent Builder), with connector mapping & orphaned-owner detection"
        - "Copilot Studio + Agent Builder (Power Platform-built)"
        - "✓ Power Platform admin center > Manage > Inventory (or Manage > Copilot Studio). A separate plane from the M365 registry; needs a Power Platform / Dynamics 365 admin role, no Agent 365 license. Unlike the M365 registry it also surfaces Agent Builder drafts."
        - "✗ Agent 365 does not replace it — the M365 registry is tenant-availability-scoped and shows no Power Platform drafts or environments."
      - - "Build-time guardrails & ALM: environments, solutions, pipelines, managed environments + DLP / connector / HTTP / channel data policies (tenant · environment · agent level)"
        - "Copilot Studio (Power Platform environments)"
        - "✓ Power Platform admin center is the authoritative build/platform-governance plane. DLP data-policy enforcement is on for ALL tenants since early 2025. Needs a PP / Environment Admin role, no Agent 365 license."
        - "✗ Agent 365 has NO ALM / environment / DLP plane — it consumes the published agent and adds tenant approval + security depth on top; it does not replace Power Platform governance."
      - - "Capacity & cost governance: per-agent monthly Copilot-credit limit + automatic hard turn-off at the limit"
        - "Copilot Studio only (Power Platform-billed)"
        - "✓ Power Platform admin center > Licensing > Copilot Studio > Manage Agents: set a credit cap, see month-to-date billed credits, turn an agent off. No Agent 365 license."
        - "✗ Not an Agent 365 capability — capacity & spend stay in Power Platform."
      - - "Lifecycle: install/uninstall, enable/disable, assign, block, remove"
        - "Agent Builder + Copilot Studio"
        - "✓ Full lifecycle from the Copilot Control System (CCS)."
        - "✓ Unchanged — same actions inside the registry."
      - - "Delete the agent"
        - "Agent Builder + Copilot Studio (mechanism differs)"
        - "✓ Agent Builder: owner deletes via the registry. Copilot Studio: needs Power Platform environment-admin rights; the Entra identity is deleted too."
        - "✓ Unchanged."
      - - "Org catalog: approve / reject requests, publish to the Agent Store"
        - "Agent Builder (shared) + Copilot Studio (requested)"
        - "✓ Requests view. Only an AI Administrator or Global Administrator may approve."
        - "✓ Surfaced as 'Pending requests' governance cards."
      - - "Ownership: find ownerless agents, assign / reassign owner (incl. access to the previous owner's uploaded files)"
        - "Agent Builder + Copilot Studio (reassign is supported for these two types only)"
        - "✓ 'Agents without owners' dashboard: live count, one-click filter, real-time update when a user is hard-deleted; then block, delete or assign a new owner. The new owner inherits the previous owner's uploaded files."
        - "✓ Surfaced proactively as 'Agents without owners' governance cards."
      - - "Per-agent Risks column in the registry"
        - "All registry agents"
        - "✗ Not shown."
        - "✓ Requires Microsoft E7 / Agent 365. Aggregates Entra + Defender + Purview signals."
      - - "Security tab per agent — Defender signals + Purview AI observability, DLP, audit"
        - "All registry agents"
        - "✗ Not available."
        - "✓ Requires E7 / Agent 365: monitor activity, protect sensitive data, evaluate compliance gaps."
      - - "Defender real-time runtime protection — AI Prompt Shield flags/blocks prompt injection at runtime (the #1 OWASP-LLM risk), before the tool call"
        - "Copilot Studio + Foundry (the acting agents); local AI agents via Defender for Endpoint"
        - "✗ —"
        - "✓ Prompt injection shows as a HIGH-severity signal in the Risks column (source: Defender + Entra SSE). From July 1, 2026 this layer requires an Agent 365 license (was Defender for Cloud Apps)."
      - - "Entra Agent ID + Conditional Access on the agent's own identity"
        - "Copilot Studio + Foundry — NOT Agent Builder (it has no identity)"
        - "~ Copilot Studio agents get an Entra Agent ID; applying Conditional Access / identity governance needs Entra Agent ID licensing. Agent Builder agents have no app registration or Agent ID at all."
        - "✓ Governed like a user object — least-privilege access packages, connector permissions targetable with CA."
      - - "Registry sync of external agents (Bedrock, Vertex AI, Salesforce, Databricks)"
        - "3rd-party platforms only (not Agent Builder / Copilot Studio)"
        - "✗ Microsoft-platform agents only."
        - "✓ Connect external platforms into the one registry (preview)."
      - - "Automatic activity / usage telemetry + business-impact metrics"
        - "Copilot Studio (auto-emitted) + others via the registry"
        - "~ Basic inventory, status and 'at risk / exceptions' views only."
        - "✓ Automatic telemetry (no SDK instrumentation) — adoption, health, business impact."
      - - "Govern files attached to an agent: embedded-file knowledge (sensitivity label auto-applied) + 'embedded files' inventory filter (File name · sensitivity · SharePoint container ID)"
        - "Agent Builder ONLY (the only builder that embeds files as knowledge)"
        - "✓ Most-restrictive label of the uploaded 20-file max (.docx/.pptx/.xlsx/.pdf/.txt) is applied automatically; only users with extract rights to that label can install/use the agent; files live in tenant-owned SharePoint Embedded containers; audit via the registry filter. Note: Purview Information Barriers are NOT supported on embedded files."
        - "✓ Purview DLP can exclude labeled files so their content isn't used in responses (only cited); a SharePoint .agent file is governed by DLP via its .agent extension condition."
      - - "Work IQ / MCP tool-server governance: allow or block tool servers, scoped per-agent consent, every tool call traced"
        - "Copilot Studio + Foundry / pro-code (tool-calling agents) — NOT Agent Builder"
        - "~ You manage which of these agents are installed, but not the tool layer itself."
        - "✓ M365 admin center > Agents and tools: activate/block Work IQ & custom MCP servers, scope permissions, full per-call observability in Defender."
      - - "Risk-based controls on the agent identity: ID Protection (block high/medium/low-risk agents) + ID Governance (sponsors, access reviews, time-bound least-privilege access packages)"
        - "Copilot Studio + Foundry — NOT Agent Builder (no identity)"
        - "✗ Needs Microsoft Entra ID P2 (ID Protection) / P1 (ID Governance) on top."
        - "✓ Agent 365 license + Entra ID P1/P2: agent-risk Conditional Access, access reviews, sponsor accountability so access doesn't outlive the need."
      - - "Network controls / SASE: monitor & block malicious or non-compliant agent network traffic"
        - "Copilot Studio agents on user devices (+ on-device agents) — NOT Agent Builder"
        - "✗ Requires Microsoft Entra Internet Access (Global Secure Access)."
        - "✓ Agent 365 + Entra Internet Access: stop agents reaching disallowed destinations at the network edge."
      - - "Programmatic registry management via Microsoft Graph API (bulk list agents, fetch agent details)"
        - "All registry agents"
        - "✓ Preview Graph endpoints (copilotPackages) work with the AI Administrator role — no extra license."
        - "✓ Automate bulk onboarding, governance and compliance reporting across the converged registry."
      - - "First-party Microsoft-installed agents (Researcher & Analyst) — preinstalled/pre-pinned Copilot Chat tools"
        - "First-party (1P) — NOT Agent Builder / Copilot Studio; exempt from agent-specific settings"
        - "✓ Block tenant-wide in the admin center; per-user/group assignment is greyed out (they're core Chat, not agents). Not available in GCC/GCCH/DoD."
        - "✓ They coexist with Agent 365 and obey agent governance, but stay part of core Copilot Chat — they don't fall under agent-specific settings."
    note: >-
      Bottom line on agent types: every Agent Builder and Copilot Studio agent is visible AND governable in the baseline admin
      center with just an admin role — no Agent 365 license. The split that matters: Agent Builder agents are declarative,
      knowledge-only and have NO Entra identity, so identity-based controls (Conditional Access, connector scopes, runtime
      protection) only apply to Copilot Studio and Foundry agents. The Agent 365 / Microsoft E7 license is what unlocks the
      security & risk depth (Risks column, Security tab, Defender runtime protection, Purview observability) plus 3rd-party
      Registry sync. For Copilot Studio, the M365 admin center is the tenant-wide registry (governance) while the Power
      Platform admin center keeps the environment-scoped build plane — ALM (environments, solutions, pipelines, managed
      environments), DLP / connector data policies, and capacity / credit limits. Three planes, three jobs: Power Platform
      admin center = how it is built & operated; the baseline M365 registry = what is exposed in the tenant; Agent 365 / E7 =
      the security & risk depth. Agent 365 does NOT replace Power Platform governance — they are complementary. Two capability classes split cleanly
      by type: only Agent Builder embeds files as knowledge, so the sensitivity-label + embedded-file governance is uniquely
      its; everything that touches a tool layer or an identity (Work IQ / MCP tool governance, ID Protection, ID Governance,
      network/SASE controls) applies to Copilot Studio and Foundry — never to Agent Builder, which is declarative and
      identity-less. Several identity controls also need Entra ID P1/P2 or Entra Internet Access in addition to the Agent 365 license.
      Two special cases: Researcher & Analyst are first-party Microsoft-installed Copilot Chat tools — you can block them
      tenant-wide but not assign them per user/group, and they sit outside agent-specific settings. And prompt injection (the
      #1 OWASP-LLM risk) is caught at runtime by Defender / AI Prompt Shield and surfaced as a HIGH-severity Risks signal.
    sources:
